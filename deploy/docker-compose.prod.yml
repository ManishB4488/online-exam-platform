# Production stack. Used by the Ansible playbook, which runs it with ready-made images
# (the ones Jenkins just built and scanned) instead of building them again.
# All secrets arrive as environment variables. Nothing secret is written in this file.
name: online-exam-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d examdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: exam-backend:${IMAGE_TAG:?IMAGE_TAG is missing}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/examdb
      DB_USER: exam
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing}
      # No sample accounts. One admin, created from the secret below on first start.
      APP_SEED_DEMO_DATA: "false"
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is missing}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is missing}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8090}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: exam-frontend:${IMAGE_TAG:?IMAGE_TAG is missing}
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  db-data:
