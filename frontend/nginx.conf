server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads can be up to 5 MB, and nginx stops anything over 1 MB by default
    client_max_body_size 6m;

    # Docker's own name server, so the backend name is looked up when it is needed
    resolver 127.0.0.11 valid=10s;

    # The browser talks to /api, and nginx passes it on to the backend container
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files with a hash in the name never change, so the browser can keep them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address belongs to the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}